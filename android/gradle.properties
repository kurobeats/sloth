org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# Built-in Kotlin: the app module never applied KGP itself, so this is the whole
# migration. The build still warns about home_widget, whose build.gradle keeps a
# legacy `apply plugin: 'kotlin-android'` for old Flutter versions; Flutter finds
# it with a text match, not by asking Gradle. At runtime the plugin checks this
# same flag and skips KGP, so nothing in this build applies it — the warning goes
# away when that legacy branch is dropped upstream (no newer version than 0.10.0).
android.builtInKotlin=true
