name: Build

# Only a release tag builds. Pushing to main is a plain commit, so CI is not
# spent on every push; run it by hand with the Run workflow button if needed.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Release builds only inherit permissions from the main manifest, so a
      # missing INTERNET entry there ships an APK that cannot reach any server.
      - run: grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml
      - run: flutter analyze
      - run: flutter test
      # A changed keystore means every installed copy has to be uninstalled
      # before it can update, so fail here rather than after a release.
      - name: Check the release signing key
        run: |
          fingerprint=$(keytool -list -v -keystore android/app/sloth-release.jks \
            -storepass sloth-release | grep -m1 'SHA256:' | sed 's/^.*SHA256: //')
          grep -q "$fingerprint" android/sloth-release-cert.txt

  apk:
    name: Release APKs
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Signed with the committed keystore, so releases keep one identity and
      # install over each other.
      - run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: sloth-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error
      - name: Attach APKs to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-*-release.apk
          generate_release_notes: true
